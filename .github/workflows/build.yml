name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Umbraco.Community.AI.Chatbot.Web.StaticAssets/Client/package-lock.json

      - name: Install frontend deps
        working-directory: src/Umbraco.Community.AI.Chatbot.Web.StaticAssets/Client
        run: npm ci

      - name: Build frontend
        working-directory: src/Umbraco.Community.AI.Chatbot.Web.StaticAssets/Client
        run: npm run build

      - name: Restore .NET
        run: dotnet restore Umbraco.Community.AI.Chatbot.slnx

      - name: Build .NET
        run: dotnet build Umbraco.Community.AI.Chatbot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Umbraco.Community.AI.Chatbot.slnx --no-build --configuration Release --verbosity normal

      # On tag pushes (v0.1.0, v0.1.0-alpha.1, …) pack and publish.
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack Umbraco.Community.AI.Chatbot.slnx --no-build --configuration Release --output ./artifacts

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
